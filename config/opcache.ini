; Production OPcache configuration (Section 7.e).
;
; Included by the production php.ini (or dropped into
; /etc/php/<version>/fpm/conf.d/ as its own file, per the server setup
; documented in Section 11/14) — never enabled with these settings on
; a local dev machine, where opcache.validate_timestamps=0 would mean
; edited files stop taking effect until the service is restarted.

[opcache]
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000

; Skips the filesystem stat() call on every request. Safe in
; production because deploys are a fresh release, not an in-place
; file edit — see the deploy script (Section 7.f / Section 14), which
; restarts php-fpm after every release specifically so this can be 0.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
